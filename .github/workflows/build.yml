name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libboost-dev \
          libglfw3-dev \
          pkg-config
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
    
    - name: Verify artifacts
      run: |
        test -f build/example/qdrive_example
        test -f build/example/qdrive_example_can
        test -f build/tool/gui/qdrive_gui
        echo "✓ All Linux build artifacts created successfully"

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup vcpkg
      run: |
        cd $env:TEMP
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        echo "${{ github.workspace }}\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Install dependencies via vcpkg
      run: |
        ${{ github.workspace }}/vcpkg/vcpkg install boost-headers:x64-windows
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -S .. -B . `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DWITHOUT_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release -j
    
    - name: Verify artifacts
      shell: pwsh
      run: |
        $artifacts = @(
          "build/example/Release/qdrive_example.exe",
          "build/example/Release/qdrive_example_can.exe"
        )
        foreach ($artifact in $artifacts) {
          if (Test-Path $artifact) {
            Write-Host "✓ Found: $artifact"
          } else {
            Write-Host "✗ Missing: $artifact"
            exit 1
          }
        }
        Write-Host "✓ All Windows build artifacts created successfully"

  build-linux-no-gui:
    name: Build on Linux (WITHOUT_GUI)
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev pkg-config
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DWITHOUT_GUI=ON
    
    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
    
    - name: Verify artifacts
      run: |
        test -f build/example/qdrive_example
        echo "✓ Linux (WITHOUT_GUI) build successful"

  build-linux-no-logger:
    name: Build on Linux (WITHOUT_LOGGER)
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev pkg-config
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DWITHOUT_LOGGER=ON
    
    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
    
    - name: Verify artifacts
      run: |
        echo "✓ Linux (WITHOUT_LOGGER) build successful"
