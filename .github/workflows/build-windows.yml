name: Build on Windows

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'image/**'
      - 'script/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'image/**'
      - 'script/**'
      - '.github/workflows/build-linux.yml'


jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Update submodules
      run: git submodule update --init --recursive
    
    - name: Setup vcpkg
      run: |
        cd ${{ github.workspace }}
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
    
    - name: Install dependencies via vcpkg
      run: |
        cd ${{ github.workspace }}\vcpkg
        .\vcpkg install boost-headers:x64-windows boost-asio:x64-windows fmt:x64-windows glfw3:x64-windows
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -S .. -B . `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release -j
    
    - name: Verify artifacts
      shell: pwsh
      run: |
        $artifacts = @(
          "build/example/Release/qdrive_example.exe",
          "build/example/Release/qdrive_example_can.exe"
        )
        foreach ($artifact in $artifacts) {
          if (Test-Path $artifact) {
            Write-Host "✓ Found: $artifact"
          } else {
            Write-Host "✗ Missing: $artifact"
            exit 1
          }
        }
        Write-Host "✓ All Windows build artifacts created successfully"
